name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore FisicoCombat.sln
      - run: dotnet build FisicoCombat.sln --no-restore -c Release
      - run: dotnet test FisicoCombat.sln --no-build -c Release -- xUnit.MaxParallelThreads=2
